appId: com.acon.desktop
productName: Acon
directories:
  output: release
  buildResources: build
# The bundle only needs the built output; the renderer's source and dev tooling
# live in the repo above and are already compiled into dist/renderer.
files:
  - dist/**
  - package.json
extraResources:
  - from: ../public/logo.png
    to: logo.png
mac:
  icon: ../public/logo.png
  category: public.app-category.graphics-design
  target:
    - target: dmg
      arch:
        - arm64
        - x64
win:
  icon: ../public/logo.png
  target: nsis
linux:
  icon: ../public/logo.png
  target: AppImage
  category: Graphics
